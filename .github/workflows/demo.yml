name: GitHub Actions Demo

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
  # 外部 Webhook/API 远程触发 (支持自定义 event_type 与 client_payload 数据)
  # 官方文档参考: https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#repository_dispatch
  repository_dispatch:
    types: [webhook_trigger, deploy_event]

jobs:
  build-and-test:
    # Runner 可选列表参考文档: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md 预装软件列表
    runs-on: ubuntu-24.04

    steps:
      # Action 来源: https://github.com/actions/checkout
      - name: Checkout repository code
        uses: actions/checkout@v7

      # Action 来源: https://github.com/actions/setup-node
      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Inspect Runner Environment
        run: |
          sudo apt-get update -y && sudo apt-get install -y ncdu duf
          node .github/scripts/inspect-env.js

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test

      # 原生 Node.js 自研钉钉通知脚本 (独立 notify.md 模板维护，零依赖，零 Warning)
      - name: Send Custom DingTalk Notification
        if: always()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: node .github/scripts/send-dingtalk.js
