name: GitHub Actions Demo

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    # Runner 可选列表参考文档: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: ubuntu-24.04

    steps:
      # Action 来源: https://github.com/actions/checkout
      - name: Checkout repository code
        uses: actions/checkout@v7

      # Action 来源: https://github.com/actions/setup-node
      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Inspect Runner Environment
        run: node .github/scripts/inspect-env.js

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test

      # 原生 Node.js 自研钉钉通知脚本 (独立 notify.md 模板维护，零依赖，零 Warning)
      - name: Send Custom DingTalk Notification
        if: always()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: node .github/scripts/send-dingtalk.js
